
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny-Tools - Free URL Shortener, Image Optimizer & Document Compressor</title>
    <meta name="description" content="Tiny-Tools is the ultimate free toolkit for making everything smaller. Shorten URLs, optimize images, and compress documents with our powerful online tools. Fast, secure, and completely free." />
    <meta name="keywords" content="URL shortener, image optimizer, document compressor, free tools, web optimization, file compression, link shortener" />
    <meta name="author" content="Tiny-Tools" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tiny-tools.app" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tiny-Tools" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tiny-tools.app" />
    <meta property="og:title" content="Tiny-Tools - Free URL Shortener, Image Optimizer & Document Compressor" />
    <meta property="og:description" content="The ultimate free toolkit for making everything smaller. Shorten URLs, optimize images, and compress documents with our powerful online tools." />
    <meta property="og:image" content="https://tiny-tools.app/og-image.png" />
    <meta property="og:site_name" content="Tiny-Tools" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tiny-tools.app" />
    <meta name="twitter:title" content="Tiny-Tools - Free URL Shortener, Image Optimizer & Document Compressor" />
    <meta name="twitter:description" content="The ultimate free toolkit for making everything smaller. Shorten URLs, optimize images, and compress documents with our powerful online tools." />
    <meta name="twitter:image" content="https://tiny-tools.app/og-image.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Tiny-Tools",
      "description": "Free URL shortener, image optimizer, and document compressor toolkit",
      "url": "https://tiny-tools.app",
      "applicationCategory": "Utility",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
